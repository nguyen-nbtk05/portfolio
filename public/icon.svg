<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dot-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14b8a6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Clean White Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="#ffffff" stroke="#e2e8f0" stroke-width="12" />

  <!-- Perfectly Centered Letter N (Original Design Proportions) -->
  <path d="M 166 370 V 142 L 346 370 V 142" 
        stroke="url(#n-grad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Signature Teal Dot '.' Aligned to Baseline Y=370 -->
  <circle cx="418" cy="370" r="24" fill="url(#dot-grad)" filter="url(#dot-shadow)" />
</svg>
